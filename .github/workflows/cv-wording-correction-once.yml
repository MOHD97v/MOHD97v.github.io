name: One-time CV wording correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cv-wording-correction-once.yml'

permissions:
  contents: write

jobs:
  correct-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Remove repo-specific artifact detail from Software Engineer CV
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          path = Path("cv/backend-engineer.pdf")
          doc = fitz.open(path)
          phrase = "; 3-day build artifacts"
          found = 0
          for page in doc:
              rects = page.search_for(phrase)
              for rect in rects:
                  page.add_redact_annot(rect, fill=(1, 1, 1))
                  found += 1
              if rects:
                  page.apply_redactions(images=0, graphics=0, text=0)
          if found != 1:
              raise RuntimeError(f"Expected 1 exact CV phrase, found {found}")
          tmp = path.with_suffix(".new.pdf")
          doc.save(tmp, garbage=4, deflate=True)
          doc.close()
          updated = fitz.open(tmp)
          text = '\n'.join(page.get_text() for page in updated)
          assert phrase not in text
          assert "DevOps & CI/CD: GitHub Actions; automated Django testing; system checks" in text
          assert len(updated) == 2
          updated.close()
          tmp.replace(path)
          PY
      - name: Commit corrected PDF
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cv/backend-engineer.pdf
          git commit -m 'Remove artifact retention detail from backend CV'
          git push
