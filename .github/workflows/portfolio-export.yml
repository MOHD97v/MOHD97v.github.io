name: Build downloadable portfolio PDF

on:
  push:
    branches: [main]
    paths:
      - index.html
      - tools/build_portfolio_pdf.py
      - .github/workflows/portfolio-export.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-pdf-main
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install 'reportlab==4.4.9'

      - name: Build portfolio PDF
        run: python tools/build_portfolio_pdf.py

      - name: Validate generated PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('portfolio/Mohammed_Almutairi_Portfolio.pdf')
          if p.stat().st_size < 5000 or not p.read_bytes().startswith(b'%PDF-'):
              raise SystemExit('PDF validation failed')
          print('Validated', p, p.stat().st_size, 'bytes')
          PY

      - name: Commit downloadable PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portfolio/Mohammed_Almutairi_Portfolio.pdf
          if git diff --cached --quiet; then
            echo 'Portfolio PDF is already current'
          else
            git commit -m 'Refresh downloadable portfolio PDF'
            git push
          fi
