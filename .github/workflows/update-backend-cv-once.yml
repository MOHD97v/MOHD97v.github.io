name: One-time backend CV update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-backend-cv-once.yml'

permissions:
  contents: write

jobs:
  update-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Add CI/CD to backend CV
        run: python .github/scripts/update-backend-cv.py
      - name: Commit updated PDF
        run: |
          if git diff --quiet -- cv/backend-engineer.pdf; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cv/backend-engineer.pdf
          git commit -m 'Add GitHub Actions CI/CD to backend CV'
          git push
